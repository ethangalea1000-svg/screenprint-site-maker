name: Deploy standalone Langue to GitHub Pages

on:
  push:
    branches:
      - fix/standalone-github-pages
      - fix/github-pages-static-deploy
      - feat/full-english-curriculum
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Run tests
        run: npm test
      - name: Build standalone client application
        run: npx vite build --config vite.pages.config.ts
      - name: Verify static application output
        shell: bash
        run: |
          set -euo pipefail
          test -s .output/public/index.html
          test -d .output/public/assets
          grep -q '<div id="root"></div>' .output/public/index.html
          grep -Eq 'src="/screenprint-site-maker/assets/[^"]+\.js"' .output/public/index.html
          ! grep -qi 'lovable\.app' .output/public/index.html
          test -n "$(find .output/public/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll
          echo "Standalone SPA shell and JavaScript bundle verified."
          find .output/public -maxdepth 2 -type f -printf '%p (%s bytes)\n' | sort | head -80
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test the published site
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://ethangalea1000-svg.github.io"
          PAGE="$SITE/screenprint-site-maker/"
          for attempt in {1..10}; do
            if curl --fail --silent --show-error "$PAGE" -o /tmp/pages-index.html; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "GitHub Pages did not return the published index after retries."
              exit 1
            fi
            sleep 5
          done
          grep -q '<div id="root"></div>' /tmp/pages-index.html
          grep -Eq 'src="/screenprint-site-maker/assets/[^"]+\.js"' /tmp/pages-index.html
          ! grep -qi 'lovable\.app' /tmp/pages-index.html
          ASSET_PATH="$(grep -oE 'src="/screenprint-site-maker/assets/[^"]+\.js"' /tmp/pages-index.html | head -n 1 | cut -d '"' -f 2)"
          curl --fail --silent --show-error "$SITE$ASSET_PATH" -o /dev/null
          echo "Published HTML and its JavaScript bundle are reachable without a Lovable redirect."

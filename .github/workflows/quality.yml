name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      # Match the Nitro version used by the static Pages build; the pinned beta has a Vite 8 static-preset bug.
      - name: Install Nitro static-build fix
        run: npm install --no-save --no-audit --no-fund --legacy-peer-deps 'nitro@npm:nitro-nightly@3.0.1-20260820-204949-2b3f1011'
      - name: Run curriculum and unit tests
        run: npm test
      - name: Check lint (advisory until repository formatting is normalized)
        run: npm run lint
        continue-on-error: true
      - name: Build production bundle
        run: npm run build

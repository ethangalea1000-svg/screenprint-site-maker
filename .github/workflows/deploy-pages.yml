name: Deploy Langue to GitHub Pages

on:
  push:
    branches: [fix/github-pages-static-deploy, feat/full-english-curriculum, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      # Nitro's June beta has a known Vite 8 static-preset build failure.
      # Use the upstream-fixed nightly only in this Pages build until a stable fix is published.
      - name: Install Nitro static-build fix
        run: npm install --no-save --no-audit --no-fund --legacy-peer-deps 'nitro@npm:nitro-nightly@3.0.1-20260820-204949-2b3f1011'
      - name: Run tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Normalize and verify static output
        shell: bash
        run: |
          set -euxo pipefail
          echo "Generated files before normalization:"
          ls -la .output/public
          find .output/public -maxdepth 2 -type f -printf '%p (%s bytes)\n' | sort | head -80
          # Nitro's GitHub Pages preset emits the prerendered root as "index".
          # GitHub Pages requires the default document to be named index.html.
          if [ ! -s .output/public/index.html ]; then
            if [ -s .output/public/index ]; then
              cp -f .output/public/index .output/public/index.html
            elif [ -s .output/public/404.html ]; then
              echo "Root document missing; refusing to publish an error page as the home page."
              exit 1
            else
              echo "No non-empty prerendered root document found."
              exit 1
            fi
          fi
          test -d .output/public/assets
          test -s .output/public/index.html
          echo "Static site output verified."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
